name: "compile with openwrt sdk"

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  TZ: Asia/Shanghai
  PACKAGE_NAME: luci-app-wrtpilot
  REPOSITORY: ${{ github.repository }}

permissions:
  contents: write

jobs:
  job_check:
    name: Check Version
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.check_version.outputs.latest_version }}
      has_update: ${{ steps.check_version.outputs.has_update }}

    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Check version
        id: check_version
        env:
          RELEASE_API: https://api.github.com/repos/${{ env.REPOSITORY }}/releases/latest
        run: |
          set -e

          cd "${PACKAGE_NAME}"

          latest_version=$(awk -F ':=' '/^PKG_VERSION:=/ {print $2}' Makefile | tr -d ' \n')

          if [ -z "$latest_version" ]; then
            echo "Failed to read PKG_VERSION from Makefile"
            exit 1
          fi

          echo "latest_version=${latest_version}" >> "$GITHUB_OUTPUT"

          remote_latest_version=$(wget -qO- -t1 -T2 "$RELEASE_API" | jq -r '.tag_name // empty')

          if [ -z "$remote_latest_version" ] || [ "$remote_latest_version" = "null" ]; then
            echo "Failed to fetch remote tags"
            echo "has_update=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Local version: ${latest_version}"
          echo "Remote latest: ${remote_latest_version}"

          remote_version_without_v=${remote_latest_version#v}

          if [ "$latest_version" = "$remote_version_without_v" ]; then
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release
        if: steps.check_version.outputs.has_update == 'true'
        run: |
          echo "![](https://img.shields.io/github/downloads/${{ env.REPOSITORY }}/v${{ steps.check_version.outputs.latest_version }}/total?style=flat-square)" >> release.txt
          touch release.txt

      - name: Generate new tag & release
        if: steps.check_version.outputs.has_update == 'true'
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.check_version.outputs.latest_version }}
          body_path: release.txt

  job_build:
    name: Build WrtPilot [${{ matrix.version }}]
    needs: job_check
    if: needs.job_check.outputs.has_update == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - version: ipk
            container_tag: x86_64-24.10.6
          - version: apk
            container_tag: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Generate .config for Language Packs
        run: |
          echo "CONFIG_PACKAGE_luci-app-wrtpilot=m" > .config
          echo "CONFIG_PACKAGE_luci-i18n-wrtpilot-zh-cn=y" >> .config

      - name: Setup OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.container_tag }}
          PACKAGES: luci-app-wrtpilot
          V: s

      - name: Process and Rename Artifacts
        id: compile
        run: |
          mkdir -p "${{ github.workspace }}/upload"

          find bin/packages/ -type f -name "luci-app-wrtpilot*" \
            -exec cp {} "${{ github.workspace }}/upload/" \;

          find bin/packages/ -type f -name "luci-i18n-wrtpilot*" \
            -exec cp {} "${{ github.workspace }}/upload/" \;

          cd "${{ github.workspace }}/upload"

          if [ -z "$(find . -maxdepth 1 -type f -print -quit)" ]; then
            echo "No WrtPilot packages were generated"
            exit 1
          fi

          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        if: steps.compile.outputs.status == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.job_check.outputs.package_version }}
          files: ${{ github.workspace }}/upload/*
