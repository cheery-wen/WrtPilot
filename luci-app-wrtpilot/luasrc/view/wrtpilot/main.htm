<%+header%>

<style>
    /* ── CSS变量：亮色主题 ─────────────────────────────── */
    :root {
        --wrtpilot-text:          #1e293b;
        --wrtpilot-text-muted:    #475569;
        --wrtpilot-border:        #d1d5db;
        --wrtpilot-bg-card:       transparent;
        --wrtpilot-bg-status:     #eff6ff;
        --wrtpilot-border-status: #93c5fd;
        --wrtpilot-text-status:   #1e3a8a;
        --wrtpilot-bg-assets:     transparent;
        --wrtpilot-border-assets: #d1d5db;
        --wrtpilot-divider:       #e5e7eb;
        --wrtpilot-log-bg:        #0f172a;
        --wrtpilot-log-text:      #dbeafe;
        --wrtpilot-log-border:    #334155;
        --wrtpilot-ok:            #16a34a;
        --wrtpilot-new:           #dc2626;
        --wrtpilot-warn:          #d97706;
        --wrtpilot-modal-bg:      #ffffff;
        --wrtpilot-modal-text:    #1e293b;
        --wrtpilot-modal-muted:   #475569;
        --wrtpilot-spinner-track: #e2e8f0;
        --wrtpilot-spinner-head:  #2563eb;
        --wrtpilot-overlay:       rgba(15, 23, 42, 0.70);
        --wrtpilot-accent:        #2563eb;
        --wrtpilot-danger:        #ef4444;
        --wrtpilot-card-shadow:   0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
        --wrtpilot-row-hover:     rgba(148, 163, 184, 0.13);
        --wrtpilot-row-selected:  rgba(37, 99, 235, 0.09);
        --wrtpilot-input-ro-bg:   rgba(148, 163, 184, 0.07);
    }

    /* ── 暗色主题变量覆盖（JS检测后设置 data-wrtpilot-dark 属性触发） ── */
    #wrtpilot-root[data-wrtpilot-dark] {
        --wrtpilot-text:          #e2e8f0;
        --wrtpilot-text-muted:    #94a3b8;
        --wrtpilot-border:        #334155;
        --wrtpilot-bg-status:     #1e2d40;
        --wrtpilot-border-status: #3b82f6;
        --wrtpilot-text-status:   #93c5fd;
        --wrtpilot-border-assets: #334155;
        --wrtpilot-divider:       #1e293b;
        --wrtpilot-log-bg:        #0a0f1e;
        --wrtpilot-log-text:      #bfdbfe;
        --wrtpilot-log-border:    #1e3a5f;
        --wrtpilot-ok:            #4ade80;
        --wrtpilot-new:           #f87171;
        --wrtpilot-warn:          #fbbf24;
        --wrtpilot-modal-bg:      #1e293b;
        --wrtpilot-modal-text:    #e2e8f0;
        --wrtpilot-modal-muted:   #94a3b8;
        --wrtpilot-spinner-track: #334155;
        --wrtpilot-spinner-head:  #60a5fa;
        --wrtpilot-overlay:       rgba(0, 0, 0, 0.80);
        --wrtpilot-accent:        #60a5fa;
        --wrtpilot-danger:        #fb7185;
        --wrtpilot-card-shadow:   0 2px 8px rgba(0,0,0,0.35);
        --wrtpilot-row-hover:     rgba(148, 163, 184, 0.10);
        --wrtpilot-row-selected:  rgba(96, 165, 250, 0.14);
        --wrtpilot-input-ro-bg:   rgba(148, 163, 184, 0.05);
    }

    /* ── 组件样式（全部使用CSS变量）─────────────────────── */
    #wrtpilot-root {
        max-width: none;
        margin: 0;
        padding: 14px 16px 12px;
    }

    #wrtpilot-root.wrtpilot-input-locked {
        pointer-events: none;
        user-select: none;
    }

    #wrtpilot-root h2 {
        margin: 0 0 8px;
        color: var(--wrtpilot-text);
        letter-spacing: 0;
    }

    #wrtpilot-root .wrtpilot-subtitle {
        color: var(--wrtpilot-text-muted);
        margin: 0 0 14px;
        font-size: 12px;
    }

    #wrtpilot-root .cbi-value-title {
        color: var(--wrtpilot-text) !important;
        font-weight: 600;
    }

    #wrtpilot-root .wrtpilot-wide {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
    }

    .wrtpilot-layout {
        display: grid;
        grid-template-columns: repeat(10, minmax(0, 1fr));
        grid-auto-rows: minmax(0, auto);
        gap: 16px;
        align-items: stretch;
    }

    .wrtpilot-card {
        border: 1px solid var(--wrtpilot-border);
        border-radius: 12px;
        background: var(--wrtpilot-bg-card);
        padding: 16px;
        box-shadow: var(--wrtpilot-card-shadow), 0 6px 18px rgba(15, 23, 42, 0.08);
        transition: box-shadow 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
    }

    .wrtpilot-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--wrtpilot-card-shadow), 0 20px 38px rgba(15, 23, 42, 0.22);
        border-color: color-mix(in srgb, var(--wrtpilot-border) 65%, var(--wrtpilot-accent) 35%);
    }

    .wrtpilot-card-title {
        margin: 0 0 14px;
        padding: 2px 0 10px 12px;
        border-left: 3px solid var(--wrtpilot-accent);
        border-bottom: 1px solid var(--wrtpilot-divider);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: var(--wrtpilot-text);
    }

    .wrtpilot-card .cbi-value {
        margin: 0 0 10px;
    }

    .wrtpilot-card .cbi-value:last-child {
        margin-bottom: 0;
    }

    .wrtpilot-card-basic .cbi-value {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
    }

    .wrtpilot-card-basic .cbi-value-title {
        margin: 0;
        text-align: left;
    }

    .wrtpilot-card-basic .cbi-value-field,
    .wrtpilot-card-basic .cbi-input-text {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
    }

    .wrtpilot-card-status { grid-column: 1 / span 5; grid-row: 1; }
    .wrtpilot-card-basic { grid-column: 6 / span 5; grid-row: 1; }
    .wrtpilot-card-log { grid-column: 1 / span 6; grid-row: 2; }
    .wrtpilot-card-assets { grid-column: 7 / span 4; grid-row: 2; }

    .wrtpilot-card-log,
    .wrtpilot-card-assets {
        min-height: 600px;
        height: 600px;
        display: flex;
        flex-direction: column;
        box-sizing: border-box;
    }

    .wrtpilot-card-log > .cbi-value-field,
    .wrtpilot-card-assets > .cbi-value-field {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
    }

    .wrtpilot-card-log > .cbi-value-field {
        flex-direction: column;
    }

    .wrtpilot-card-assets > .cbi-value-field {
        flex-direction: column;
    }

    #wrtpilot_status {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        border: 1px solid var(--wrtpilot-border-status);
        border-radius: 8px;
        background: linear-gradient(145deg, var(--wrtpilot-bg-status) 0%, rgba(148, 163, 184, 0.08) 100%);
        padding: 10px 14px;
        color: var(--wrtpilot-text-status);
        line-height: 1.7;
    }

    .wrtpilot-status-hero {
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
        font-weight: 700;
        border: 1px solid transparent;
        background: rgba(37, 99, 235, 0.08);
        color: var(--wrtpilot-text-status);
    }

    .wrtpilot-status-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
    }

    .wrtpilot-status-item {
        border: 1px dashed var(--wrtpilot-border-status);
        border-radius: 8px;
        padding: 6px 8px;
        background: rgba(255, 255, 255, 0.20);
        color: var(--wrtpilot-text-status);
        min-width: 0;
        word-break: break-word;
    }

    .wrtpilot-status-grid .wrtpilot-status-item:last-child {
        grid-column: 1 / -1;
    }

    #wrtpilot_assets {
        width: 100%;
        max-width: 100%;
        max-height: 280px;
        overflow: auto;
        border: 1px solid var(--wrtpilot-border-assets);
        border-radius: 8px;
        padding: 4px 6px;
        background: var(--wrtpilot-bg-assets);
    }

    #wrtpilot_assets .wrtpilot-asset-row {
        display: flex !important;
        align-items: center !important;
        gap: 10px;
        padding: 8px 10px;
        margin: 2px 0;
        border: 1px solid transparent;
        border-radius: 7px;
        cursor: pointer;
        transition: background 0.14s, border-color 0.14s;
        color: var(--wrtpilot-text);
        text-decoration: none;
        line-height: 1.4;
    }

    #wrtpilot_assets .wrtpilot-asset-row:hover {
        background: var(--wrtpilot-row-hover);
    }

    #wrtpilot_assets .wrtpilot-asset-row.wrtpilot-row-selected {
        background: var(--wrtpilot-row-selected);
        border-color: var(--wrtpilot-accent);
    }

    #wrtpilot_assets .wrtpilot-asset-row input[type="radio"] {
        flex: 0 0 16px;
        width: 16px;
        height: 16px;
        margin: 0;
        padding: 0;
        cursor: pointer;
        accent-color: var(--wrtpilot-accent);
        pointer-events: none;
    }

    #wrtpilot_assets .wrtpilot-asset-name {
        color: var(--wrtpilot-text);
        flex: 1;
        min-width: 0;
        word-break: break-word;
        line-height: 1.4;
    }

    #wrtpilot_log {
        width: 100%;
        max-width: 100%;
        min-height: 260px;
        height: 260px;
        display: block;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1px solid var(--wrtpilot-log-border);
        background: var(--wrtpilot-log-bg);
        color: var(--wrtpilot-log-text);
        font-family: "Cascadia Mono", "JetBrains Mono", "Consolas", monospace;
        line-height: 1.45;
    }

    .wrtpilot-status-line { margin: 3px 0; }

    #wrtpilot_release {
        background-color: var(--wrtpilot-input-ro-bg) !important;
        color: var(--wrtpilot-text-muted) !important;
    }
    .wrtpilot-conclusion-ok   { color: var(--wrtpilot-ok);   font-weight: 700; }
    .wrtpilot-conclusion-new  { color: var(--wrtpilot-new);  font-weight: 700; }
    .wrtpilot-conclusion-warn { color: var(--wrtpilot-warn); font-weight: 700; }

    .wrtpilot-status-hero.wrtpilot-conclusion-ok {
        border-color: rgba(34, 197, 94, 0.35);
        background: rgba(34, 197, 94, 0.10);
        color: var(--wrtpilot-ok);
    }

    .wrtpilot-status-hero.wrtpilot-conclusion-new {
        border-color: rgba(239, 68, 68, 0.35);
        background: rgba(239, 68, 68, 0.10);
        color: var(--wrtpilot-new);
    }

    .wrtpilot-status-hero.wrtpilot-conclusion-warn {
        border-color: rgba(245, 158, 11, 0.35);
        background: rgba(245, 158, 11, 0.10);
        color: var(--wrtpilot-warn);
    }

    #wrtpilot-root .cbi-page-actions {
        margin-top: 14px;
        text-align: right;
    }

    .wrtpilot-card-actions {
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--wrtpilot-divider);
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px;
    }

    .wrtpilot-card-actions .cbi-button {
        margin: 0;
    }

    .wrtpilot-btn-accent {
        background: #834be2 !important;
        border-color: #834be2 !important;
        color: #ffffff !important;
    }

    .wrtpilot-card-assets .cbi-value {
        display: grid;
        grid-template-columns: 140px minmax(0, 1fr);
        gap: 10px;
        align-items: center;
    }

    .wrtpilot-card-assets .cbi-value-title {
        margin: 0;
        text-align: left;
    }

    .wrtpilot-card-assets .cbi-value-field,
    .wrtpilot-card-log .cbi-value-field {
        width: 100%;
        min-width: 0;
    }

    .wrtpilot-card-assets > .cbi-value-field,
    .wrtpilot-card-log > .cbi-value-field {
        display: flex !important;
        flex-direction: column !important;
        width: 100% !important;
        box-sizing: border-box;
    }

    .wrtpilot-card-assets #wrtpilot_assets,
    .wrtpilot-card-log #wrtpilot_log {
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box;
    }

    .wrtpilot-card-log #wrtpilot_log {
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
    }

    .wrtpilot-card-assets #wrtpilot_assets {
        flex: 1 1 auto;
        min-height: 0;
        max-height: none;
        height: 100%;
    }

    .wrtpilot-basic-toggle-row {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
        line-height: 1;
    }

    .wrtpilot-basic-toggle-row div {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-weight: normal;
        color: var(--wrtpilot-text);
        line-height: 1;
        white-space: nowrap;
    }

    .wrtpilot-basic-toggle-row input[type="checkbox"] {
        margin: 0;
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        display: block;
        transform: translateY(-1px);
    }

    .wrtpilot-basic-toggle-row span {
        line-height: 1;
    }

    .wrtpilot-auto-upgrade-warning {
        color: var(--wrtpilot-warn);
        font-size: 12px;
        line-height: 1.6;
        margin: 2px 0 10px;
    }

    #wrtpilot_auto_upgrade_time {
        width: 120px;
        max-width: 100%;
        box-sizing: border-box;
    }

    #wrtpilot-root .cbi-button {
        border-radius: 10px;
        padding: 8px 16px;
        transition: opacity 0.15s, filter 0.15s;
    }

    #wrtpilot-root .cbi-button:not(:disabled):hover {
        filter: brightness(1.08);
    }

    #wrtpilot-root .cbi-button:disabled {
        opacity: 0.42;
        cursor: not-allowed;
        pointer-events: auto;
    }

    #wrtpilot_upgrade {
        background: linear-gradient(135deg, var(--wrtpilot-danger) 0%, #f97316 100%) !important;
        border-color: var(--wrtpilot-danger) !important;
        color: #ffffff !important;
    }

    #wrtpilot_upgrade:not(:disabled):hover {
        filter: brightness(1.12);
    }

    @media (max-width: 980px) {
        .wrtpilot-layout {
            grid-template-columns: 1fr;
        }

        .wrtpilot-card-status,
        .wrtpilot-card-basic,
        .wrtpilot-card-log,
        .wrtpilot-card-assets {
            grid-column: 1;
            grid-row: auto;
        }

        .wrtpilot-card-log,
        .wrtpilot-card-assets {
            height: auto;
            min-height: 0;
        }
    }

    @media (max-width: 760px) {
        #wrtpilot-root { padding: 12px; }

        .wrtpilot-status-grid {
            grid-template-columns: 1fr;
        }

        .wrtpilot-card-actions {
            justify-content: stretch;
        }

        .wrtpilot-card-actions .cbi-button {
            width: 100%;
        }

        .wrtpilot-card-basic .cbi-value,
        .wrtpilot-card-assets .cbi-value {
            grid-template-columns: 1fr;
            align-items: stretch;
        }
    }

    #wrtpilot-upgrade-modal {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: var(--wrtpilot-overlay);
        z-index: 2147483647;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        touch-action: none;
    }

    body.wrtpilot-upgrade-lock,
    html.wrtpilot-upgrade-lock {
        overflow: hidden !important;
    }

    body.wrtpilot-upgrade-lock * {
        pointer-events: none !important;
    }

    body.wrtpilot-upgrade-lock #wrtpilot-upgrade-modal,
    body.wrtpilot-upgrade-lock #wrtpilot-upgrade-modal * {
        pointer-events: auto !important;
    }

    .wrtpilot-modal-box {
        background: var(--wrtpilot-modal-bg);
        border-radius: 14px;
        padding: 36px 48px;
        text-align: center;
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
        max-width: 420px;
        width: 90%;
    }

    .wrtpilot-modal-spinner {
        width: 48px; height: 48px;
        border: 5px solid var(--wrtpilot-spinner-track);
        border-top-color: var(--wrtpilot-spinner-head);
        border-radius: 50%;
        animation: wrtpilot-spin 0.8s linear infinite;
        margin: 0 auto 20px;
    }

    @keyframes wrtpilot-spin {
        to { transform: rotate(360deg); }
    }

    .wrtpilot-modal-title {
        font-size: 18px;
        font-weight: 700;
        color: var(--wrtpilot-modal-text);
        margin-bottom: 10px;
    }

    .wrtpilot-modal-msg {
        font-size: 13px;
        color: var(--wrtpilot-modal-muted);
        line-height: 1.6;
    }

    #wrtpilot-ext-modal {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: var(--wrtpilot-overlay);
        z-index: 9999;
        align-items: center;
        justify-content: center;
    }

    #wrtpilot-ext-modal.wrtpilot-modal-open {
        display: flex;
    }

    #wrtpilot-ext-modal .wrtpilot-modal-box {
        max-width: 440px;
        text-align: left;
    }

    #wrtpilot_ext_textarea {
        width: 100%;
        height: 200px;
        box-sizing: border-box;
        font-family: "Cascadia Mono", "JetBrains Mono", "Consolas", monospace;
        font-size: 13px;
        border: 1px solid var(--wrtpilot-border);
        border-radius: 8px;
        padding: 8px 10px;
        background: var(--wrtpilot-log-bg);
        color: var(--wrtpilot-log-text);
        resize: vertical;
        margin-top: 6px;
    }

    .wrtpilot-ext-modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid var(--wrtpilot-divider);
    }

</style>

<div class="cbi-map" id="wrtpilot-root">
    <h2 id="wrtpilot_title"></h2>
    <p class="wrtpilot-subtitle" id="wrtpilot_subtitle"></p>
    <div class="cbi-section wrtpilot-layout">
        <div class="wrtpilot-card wrtpilot-card-status">
            <div class="wrtpilot-card-title" id="wrtpilot_status_label"></div>
            <div id="wrtpilot_status"></div>

            <div class="wrtpilot-card-actions">
                <button class="cbi-button cbi-button-neutral wrtpilot-btn-accent" id="wrtpilot_backup" type="button"></button>
                <button class="cbi-button cbi-button-action" id="wrtpilot_refresh" type="button"></button>
                <button class="cbi-button cbi-button-neutral wrtpilot-btn-accent" id="wrtpilot_notes" type="button" disabled="disabled"></button>
            </div>
        </div>

        <div class="wrtpilot-card wrtpilot-card-basic">
            <div class="wrtpilot-card-title" id="wrtpilot_basic_title"></div>

            <div class="cbi-value">
                <label class="cbi-value-title" for="wrtpilot_release" id="wrtpilot_release_label"></label>
                <div class="cbi-value-field">
                    <input id="wrtpilot_release" class="cbi-input-text wrtpilot-wide" type="text" readonly="readonly" />
                </div>
            </div>

            <div class="cbi-value">
                <label class="cbi-value-title" for="wrtpilot_timeout" id="wrtpilot_timeout_label"></label>
                <div class="cbi-value-field" style="display:flex;align-items:center;gap:10px;">
                    <input id="wrtpilot_timeout" class="cbi-input-text" type="number" min="5" max="300" value="15" style="width:80px;" />
                    <span id="wrtpilot_timeout_hint" style="color:var(--wrtpilot-text-muted);font-size:12px;"></span>
                </div>
            </div>

            <div class="cbi-value">
                <div class="cbi-value-title"></div>
                <div class="cbi-value-field wrtpilot-basic-toggle-row">
                    <div>
                        <input id="wrtpilot_keep" type="checkbox" checked="checked" />
                        <span id="wrtpilot_keep_label"></span>
                    </div>
                    <div>
                        <input id="wrtpilot_filter_ext_enabled" type="checkbox" checked="checked" />
                        <span id="wrtpilot_filter_ext_label"></span>
                    </div>
                </div>
            </div>

            <div class="cbi-value">
                <label class="cbi-value-title" for="wrtpilot_auto_upgrade_enabled" id="wrtpilot_auto_upgrade_label"></label>
                <div class="cbi-value-field wrtpilot-basic-toggle-row">
                    <div>
                        <input id="wrtpilot_auto_upgrade_enabled" type="checkbox" />
                        <span id="wrtpilot_auto_upgrade_state_label"></span>
                    </div>
                </div>
            </div>

            <div class="cbi-value">
                <label class="cbi-value-title" for="wrtpilot_auto_upgrade_time" id="wrtpilot_auto_upgrade_time_label"></label>
                <div class="cbi-value-field" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                    <input id="wrtpilot_auto_upgrade_time" class="cbi-input-text" type="time" value="" />
                    <span id="wrtpilot_auto_upgrade_time_hint" style="color:var(--wrtpilot-text-muted);font-size:12px;"></span>
                </div>
            </div>

            <div class="wrtpilot-auto-upgrade-warning" id="wrtpilot_auto_upgrade_warning"></div>

            <div class="wrtpilot-card-actions">
                <button class="cbi-button cbi-button-neutral" id="wrtpilot_ext_config_btn" type="button"></button>

(function() {

        beginDownload: '<%:Starting download: %>',
        startingUpgrade: '<%:Starting system upgrade...%>',
        timeoutLabel: '<%:Fetch Timeout (seconds)%>',
        timeoutHint: '<%:5 ~ 300 seconds. Limits GitHub API fetch time.%>',
        autoUpgradeLabel: '<%:Automatic Firmware Upgrade%>',
        autoUpgradeStateLabel: '<%:Enable automatic upgrade%>',
        autoUpgradeTimeLabel: '<%:Automatic upgrade time%>',
        autoUpgradeTimeHint: '<%:Select the daily execution time. No default time is set.%>',
        autoUpgradeWarning: '<%:When enabled, WrtPilot will automatically download and flash firmware at the selected time without asking for confirmation. This may interrupt network access or cause device failure.%>',
        autoUpgradeTimeRequired: '<%:Please select an execution time before enabling automatic upgrade.%>',
        autoUpgradeConfirm: '<%:Automatic upgrade will download and flash firmware at the selected time without further confirmation. Continue enabling it?%>',
        saveBasicBtn: '<%:Save Basic Configuration%>',
        savingBasic: '<%:Saving basic configuration...%>',
        basicSaved: '<%:Basic configuration saved%>',
        fetchTimedOut: '<%:Unable to fetch GitHub Release, please check your network connection%>',
        notesBtn: '<%:Read Latest Release Notes%>',
        notesUnavailable: '<%:Latest release page URL is unavailable, please fetch latest release again%>',
        popupBlocked: '<%:Unable to open a new window. Please allow pop-ups in your browser.%>',
        fallbackUsedHint: '<%:Latest release assets are not ready yet, using previous release with available firmware.%>',
        partialAssetsHint: '<%:Latest release partial firmware may still be compiling, waiting to upload, or failed to compile. If your platform is missing, please wait for the next build result.%>',
        autoFilterMatched: '<%:已自动筛选为上次更新的固件名%s，如果需要更改请删除模糊检索内容%>',
        autoFilterNoMatch: '<%:最新release中没有固件名称%s，请手动筛选或等待下次仓库编译。%>',
        businessLocked: '<%:Upgrade workflow is running, please wait until current operation finishes%>'
    };

    var assets = [];
    var selectedAsset = null;
    var latestReleaseName = '';
    var latestReleaseUrl = '';
    var lastInstallEpoch = 0;
    var routerTzOffsetMin = null;
    var rebootPollTimer = null;
    var rebootPollAttempts = 0;
    var rebootPollLimit = 36;
    var rebootSeenOffline = false;
    var upgradeModalActive = false;
    var downloadPollTimer = null;
    var filterExtEnabled = true;
    var validExtensions = ['.img', '.img.gz', '.bin', '.tar', '.itb', '.trx', '.chk', '.dlf', '.ari'];
    var upgradeWorkflowBusy = false;
    var appVersion = '<%=app_version or ""%>';

    function byId(id) { return document.getElementById(id); }
    function t(key) { return I18N[key] || key; }
    function trim(s) { return String(s || '').replace(/^\s+|\s+$/g, ''); }

    function normalizeFirmwareSearchName(value) {
        return String(value || '')
            .replace(/^\d{4}\.\d{2}\.\d{2}-\d{2}\.\d{2}_/, '')
            .toLowerCase();
    }

    function updateAssetsLabel(count) {
        byId('wrtpilot_assets_label').textContent = t('assetsLabelWithCount').replace('%d', String(count || 0));
    }

    function updateTitle() {
        byId('wrtpilot_title').textContent = appVersion ? (t('title') + ' v' + appVersion) : t('title');
    }

    function updateConfig(cfg) {
        if (!cfg) { return; }
        filterExtEnabled = cfg.filter_ext_enabled !== '0';
        if (cfg.valid_extensions) {
            var exts = String(cfg.valid_extensions).split(/\s+/).filter(Boolean);
            if (exts.length > 0) { validExtensions = exts; }
        }
        var extEl = byId('wrtpilot_filter_ext_enabled');
        if (extEl) { extEl.checked = filterExtEnabled; }

        var autoUpgradeEl = byId('wrtpilot_auto_upgrade_enabled');
        if (autoUpgradeEl) {
            autoUpgradeEl.checked = cfg.auto_upgrade_enabled === '1';
        }
        var autoUpgradeTimeEl = byId('wrtpilot_auto_upgrade_time');
        if (autoUpgradeTimeEl) {
            autoUpgradeTimeEl.value = cfg.auto_upgrade_time || '';
        }
    }

    function updateFilteredAssetsLabel() {
        updateAssetsLabel(getVisibleAssets().length);
    }

    function setDisabled(id, disabled) {
        var el = byId(id);
        if (el) {
            el.disabled = !!disabled;
        }
    }

    function syncInteractiveState() {
        var root = byId('wrtpilot-root');
        var busy = !!upgradeWorkflowBusy;

        if (root) {
            root.classList.toggle('wrtpilot-input-locked', busy);
        }

        setDisabled('wrtpilot_release', busy);
        setDisabled('wrtpilot_timeout', busy);
        setDisabled('wrtpilot_keep', busy);
        setDisabled('wrtpilot_filter_ext_enabled', busy);
        setDisabled('wrtpilot_auto_upgrade_enabled', busy);
        setDisabled('wrtpilot_auto_upgrade_time', busy);
        setDisabled('wrtpilot_search', busy);

        setDisabled('wrtpilot_basic_save', busy);
        setDisabled('wrtpilot_ext_config_btn', busy);
        setDisabled('wrtpilot_refresh', busy);
        setDisabled('wrtpilot_backup', busy);
        setDisabled('wrtpilot_upgrade', busy || assets.length === 0);
        setDisabled('wrtpilot_notes', busy || !latestReleaseUrl);

        var radios = byId('wrtpilot_assets').querySelectorAll('input[type="radio"]');
        radios.forEach(function(radio) {
            radio.disabled = busy;
        });

        if (busy && root && root.contains(document.activeElement) && document.activeElement && document.activeElement.blur) {
            document.activeElement.blur();
        }
    }

    function setUpgradeWorkflowBusy(busy) {
        upgradeWorkflowBusy = !!busy;
        syncInteractiveState();
    }

    function ensureNotBusy() {
        if (!upgradeWorkflowBusy) {
            return true;
        }
        appendLog(t('businessLocked'));
        return false;
    }

    function extractFirmwareName(text) {
        var raw = trim(text || '');
        if (!raw) {
            return '';
        }

        var candidate = raw;
        if (candidate.indexOf('/') !== -1) {
            var seg = candidate.split('/');
            while (seg.length > 0) {
                var last = trim(seg.pop());
                if (last) {
                    candidate = last;
                    break;
                }
            }
        }

        return trim(candidate);
    }

    function selectAsset(asset, silent) {
        if (upgradeWorkflowBusy) {
            return;
        }
        if (!asset || !asset.url) {
            return;
        }
        selectedAsset = asset;
        byId('wrtpilot_release').value = (latestReleaseName ? (latestReleaseName + ' / ') : '') + (asset.name || '');
        renderAssets();
        if (!silent) {
            appendLog(t('selectedFirmware') + (asset.name || ''));
        }
    }

    function applyAutoFirmwareFilter(previousReleaseText) {
        if (!assets.length) {
            return;
        }

        var prevFirmware = extractFirmwareName(previousReleaseText);
        if (!prevFirmware) {
            return;
        }

        byId('wrtpilot_search').value = prevFirmware;
        renderAssets();

        var visible = getVisibleAssets();
        var lowerPrev = normalizeFirmwareSearchName(prevFirmware);
        var exact = visible.filter(function(a) {
            return normalizeFirmwareSearchName(a.name) === lowerPrev;
        });
        var matched = exact.length ? exact : visible.filter(function(a) {
            return normalizeFirmwareSearchName(a.name).indexOf(lowerPrev) !== -1;
        });

        if (matched.length > 0) {
            selectAsset(matched[0], true);
            appendLog(t('autoFilterMatched').replace('%s', matched[0].name || prevFirmware));
            return;
        }

        appendLog(t('autoFilterNoMatch').replace('%s', prevFirmware));
        selectedAsset = null;
        renderAssets();
    }

    /* 检测当前主题是否为暗色，并给 root 元素打标记 */
    function applyTheme() {
        var root = byId('wrtpilot-root');
        if (!root) return;
        var isDark = false;

        /* 1. 系统媒体查询 */
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            isDark = true;
        }

        /* 2. 常见暗色类名（body / html） */
        if (!isDark) {
            var darkClasses = ['dark', 'is-dark', 'night', 'dark-mode', 'theme-dark', 'luci-dark'];
            var body = document.body;
            var html = document.documentElement;
            for (var i = 0; i < darkClasses.length; i++) {
                if (body.classList.contains(darkClasses[i]) ||
                    html.classList.contains(darkClasses[i])) {
                    isDark = true;
                    break;
                }
            }
        }

        /* 3. data-theme / data-color-scheme 属性 */
        if (!isDark) {
            var dt = document.body.getAttribute('data-theme') ||
                     document.body.getAttribute('data-color-scheme') ||
                     document.documentElement.getAttribute('data-theme');
            if (dt && dt.indexOf('dark') !== -1) isDark = true;
        }

        /* 4. 最终兜底：读取 body 实际背景色亮度 */
        if (!isDark) {
            try {
                var bg = window.getComputedStyle(document.body).backgroundColor;
                var m = bg.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
                if (m) {
                    var lum = (0.299 * +m[1] + 0.587 * +m[2] + 0.114 * +m[3]) / 255;
                    if (lum < 0.4) isDark = true;
                }
            } catch (e) {}
        }

        if (isDark) {
            root.setAttribute('data-wrtpilot-dark', '1');
        } else {
            root.removeAttribute('data-wrtpilot-dark');
        }
    }

    function initTexts() {
        updateTitle();
        byId('wrtpilot_subtitle').textContent = t('subtitle');
        byId('wrtpilot_basic_title').textContent = t('basicTitle');
        byId('wrtpilot_search_label').textContent = t('searchLabel');
        byId('wrtpilot_search').placeholder = t('searchPlaceholder');
        byId('wrtpilot_release_label').textContent = t('releaseLabel');
        byId('wrtpilot_keep_label').textContent = t('keepLabel');
        byId('wrtpilot_filter_ext_label').textContent = t('filterExtLabel');
        byId('wrtpilot_ext_config_btn').textContent = t('extConfigBtn');
        byId('wrtpilot_ext_modal_title').textContent = t('extConfigTitle');
        byId('wrtpilot_ext_modal_hint').textContent = t('extConfigHint');
        byId('wrtpilot_ext_cancel').textContent = t('extConfigCancel');
        byId('wrtpilot_ext_save_btn').textContent = t('extConfigSaveBtn');
        byId('wrtpilot_status_label').textContent = t('statusLabel');
        updateAssetsLabel(0);
        byId('wrtpilot_log_label').textContent = t('logLabel');
        byId('wrtpilot_refresh').textContent = t('refreshBtn');
        byId('wrtpilot_notes').textContent = t('notesBtn');
        byId('wrtpilot_upgrade').textContent = t('upgradeBtn');
        byId('wrtpilot_backup').textContent = t('backupBtn');
        byId('wrtpilot_modal_title').textContent = t('upgradingTitle');
        byId('wrtpilot_modal_msg').textContent = t('upgradingMsg');
        byId('wrtpilot_upgrade_confirm').textContent = t('confirmUpgradeBtn');
        byId('wrtpilot_upgrade_cancel').textContent = t('cancelUpgradeBtn');
        byId('wrtpilot_timeout_label').textContent = t('timeoutLabel');
        byId('wrtpilot_timeout_hint').textContent = t('timeoutHint');
        byId('wrtpilot_auto_upgrade_label').textContent = t('autoUpgradeLabel');
        byId('wrtpilot_auto_upgrade_state_label').textContent = t('autoUpgradeStateLabel');
        byId('wrtpilot_auto_upgrade_time_label').textContent = t('autoUpgradeTimeLabel');
        byId('wrtpilot_auto_upgrade_time_hint').textContent = t('autoUpgradeTimeHint');
        byId('wrtpilot_auto_upgrade_warning').textContent = t('autoUpgradeWarning');
        byId('wrtpilot_basic_save').textContent = t('saveBasicBtn');

        renderStatusCard({
            conclusion: t('beginFetch'),
            conclusionCls: 'wrtpilot-conclusion-warn',
            installValue: t('fetchingInProgress'),
            latestValue: t('fetchingInProgress'),
            publishedValue: t('fetchingInProgress'),
            releaseTotalValue: t('fetchingInProgress')
        });
    }

    function pad2(v) {
        return v < 10 ? ('0' + v) : String(v);
    }

    function toRouterDate(dateObj) {
        if (!(dateObj instanceof Date) || isNaN(dateObj.getTime())) {
            return null;
        }

        var browserOffset = -new Date().getTimezoneOffset();
        var targetOffset = (typeof routerTzOffsetMin === 'number') ? routerTzOffsetMin : browserOffset;
        var shifted = new Date(dateObj.getTime() + (targetOffset - browserOffset) * 60000);
        return shifted;
    }

    function formatRouterDate(dateObj) {
        var d = toRouterDate(dateObj);
        if (!d) {
            return '-';
        }
        return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()) + ' ' +
            pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }

    function formatEpochToRouter(epoch) {
        if (!epoch) {
            return '-';
        }
        return formatRouterDate(new Date(epoch * 1000));
    }

    function formatIsoToRouter(iso) {
        if (!iso) {
            return '-';
        }
        return formatRouterDate(new Date(iso));
    }

    function appendLog(line) {
        var el = byId('wrtpilot_log');
        var ts = formatRouterDate(new Date());
        el.value += '[' + ts + '] ' + line + '\n';
        el.scrollTop = el.scrollHeight;
    }

    function setStatus(text) {
        byId('wrtpilot_status').textContent = text;
    }

    function getCurrentInstallDisplay() {
        if (lastInstallEpoch) {
            return formatEpochToRouter(lastInstallEpoch);
        }
        return t('fetchingInProgress');
    }

    function getCurrentSelectedFirmwareDisplay(selectedRaw) {
        var src = (selectedRaw !== undefined && selectedRaw !== null) ? selectedRaw : ((byId('wrtpilot_release').value || ''));
        return extractFirmwareName(src) || '-';
    }

    function renderStatusCard(opts) {
        var installText = t('installTime') + ': ' + (opts.installValue || '-');
        var releaseText = t('latestRel') + ': ' + (opts.latestValue || '-');
        var publishedText = t('pubTime') + ': ' + (opts.publishedValue || '-');
        var releaseTotalText = t('releaseTotal') + ': ' + (opts.releaseTotalValue || '-');
        var selectedText = t('releaseLabel') + ': ' + getCurrentSelectedFirmwareDisplay(opts.selectedRaw);
        var conclusionText = opts.conclusion || '-';
        var conclusionCls = opts.conclusionCls || 'wrtpilot-conclusion-ok';
        var hintHtml = opts.hintHtml || '';

        byId('wrtpilot_status').innerHTML =
            '<div class="wrtpilot-status-hero ' + conclusionCls + '">' + escHtml(conclusionText) + '</div>' +
            '<div class="wrtpilot-status-grid">' +
                '<div class="wrtpilot-status-item">' + escHtml(installText) + '</div>' +
                '<div class="wrtpilot-status-item">' + escHtml(releaseText) + '</div>' +
                '<div class="wrtpilot-status-item">' + escHtml(publishedText) + '</div>' +
                '<div class="wrtpilot-status-item">' + escHtml(releaseTotalText) + '</div>' +
                '<div class="wrtpilot-status-item">' + escHtml(selectedText) + '</div>' +
            '</div>' +
            hintHtml;
    }

    function escHtml(s) {
        return String(s || '').replace(/[&<>"']/g, function(c) {
            return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
        });
    }

    function parseJsonResponse(r) {
        return r.text().then(function(txt) {
            try {
                return JSON.parse(txt);
            } catch (e) {
                throw new Error('Server returned invalid JSON response');
            }
        });
    }

    function request(url, data) {
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
            body: new URLSearchParams(data).toString()
        }).then(parseJsonResponse);
    }

    function requestWithTimeout(url, data, timeoutMs) {
        var controller = new AbortController();
        var timer = setTimeout(function() { controller.abort(); }, timeoutMs);
        return fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8' },
            body: new URLSearchParams(data).toString(),
            signal: controller.signal
        }).then(function(r) {
            clearTimeout(timer);
            return parseJsonResponse(r);
        }).catch(function(err) {
            clearTimeout(timer);
            throw err;
        });
    }

    function humanSize(size) {
        if (!size || size <= 0) return '0 B';
        var units = ['B', 'KB', 'MB', 'GB'];
        var i = 0;
        var n = size;
        while (n >= 1024 && i < units.length - 1) {
            n /= 1024;
            i++;
        }
        return n.toFixed(i === 0 ? 0 : 2) + ' ' + units[i];
    }

    function shouldKeepAsset(asset) {
        if (!asset || typeof asset !== 'object') {
            return false;
        }

        if (!filterExtEnabled) {
            return true;
        }

        var name = String(asset.name || '').toLowerCase();
        for (var i = 0; i < validExtensions.length; i++) {
            var ext = validExtensions[i].toLowerCase();
            if (ext && name.length >= ext.length && name.slice(-ext.length) === ext) {
                return true;
            }
        }
        return false;
    }

    function getVisibleAssets() {
        return assets.filter(shouldKeepAsset);
    }

    function getSearchFilteredAssets() {
        var raw = normalizeFirmwareSearchName(byId('wrtpilot_search').value);
        var kw = raw.replace(/[\s\u3000]+/g, ' ').replace(/^\s+|\s+$/g, '');
        var tokens = kw ? kw.split(' ') : [];
        return getVisibleAssets().filter(function(a) {
            if (!tokens.length) {
                return true;
            }
            var name = normalizeFirmwareSearchName(a.name);
            for (var i = 0; i < tokens.length; i++) {
                if (name.indexOf(tokens[i]) === -1) {
                    return false;
                }
            }
            return true;
        });
    }

    function renderAssets() {
        var box = byId('wrtpilot_assets');
        box.innerHTML = '';

        var filtered = getSearchFilteredAssets();

        updateAssetsLabel(filtered.length);

        if (!filtered.length) {
            box.textContent = t('noMatch');
            return;
        }

        filtered.forEach(function(a, idx) {
            var isSelected = !!(selectedAsset && selectedAsset.url === a.url);
            var row = document.createElement('div');
            row.className = 'wrtpilot-asset-row' + (isSelected ? ' wrtpilot-row-selected' : '');

            var id = 'wrtpilot_asset_' + idx;
            var input = document.createElement('input');
            input.type = 'radio';
            input.name = 'wrtpilot_asset';
            input.id = id;
            input.value = a.url || '';
            input.addEventListener('change', function() {
                if (upgradeWorkflowBusy) {
                    return;
                }
                selectAsset(a, false);
            });

            if (isSelected) {
                input.checked = true;
            }

            var nameSpan = document.createElement('span');
            nameSpan.className = 'wrtpilot-asset-name';
            nameSpan.textContent = (a.name || '') + ' (' + humanSize(a.size || 0) + ')';

            row.addEventListener('click', function() {
                if (upgradeWorkflowBusy) {
                    return;
                }
                if (!input.checked) {
                    input.checked = true;
                    selectAsset(a, false);
                }
            });

            row.appendChild(input);
            row.appendChild(nameSpan);
            box.appendChild(row);
        });

        syncInteractiveState();
    }

    function normalizeAssets(raw) {
        if (Array.isArray(raw)) {
            return raw;
        }
        if (!raw || typeof raw !== 'object') {
            return [];
        }
        var keys = Object.keys(raw).sort(function(a, b) {
            var na = parseInt(a, 10), nb = parseInt(b, 10);
            if (!isNaN(na) && !isNaN(nb)) {
                return na - nb;
            }
            return String(a).localeCompare(String(b));
        });
        var out = [];
        keys.forEach(function(k) {
            if (raw[k] && typeof raw[k] === 'object') {
                out.push(raw[k]);
            }
        });
        return out;
    }

    function normalizeLogLines(raw) {
        if (Array.isArray(raw)) {
            return raw;
        }

        if (raw === null || raw === undefined) {
            return [];
        }

        if (typeof raw === 'string') {
            return raw ? [raw] : [];
        }

        if (typeof raw === 'object') {
            var keys = Object.keys(raw).sort(function(a, b) {
                var na = parseInt(a, 10), nb = parseInt(b, 10);
                if (!isNaN(na) && !isNaN(nb)) {
                    return na - nb;
                }
                return String(a).localeCompare(String(b));
            });
            var out = [];
            keys.forEach(function(k) {
                var v = raw[k];
                if (v !== null && v !== undefined && String(v) !== '') {
                    out.push(String(v));
                }
            });
            return out;
        }

        return [String(raw)];
    }

    function saveBasicConfig() {
        if (!ensureNotBusy()) {
            return;
        }
        var keepConfig = byId('wrtpilot_keep').checked ? '1' : '0';
        var filterExtEnabledVal = byId('wrtpilot_filter_ext_enabled').checked ? '1' : '0';
        var autoUpgradeEnabledVal = byId('wrtpilot_auto_upgrade_enabled').checked ? '1' : '0';
        var autoUpgradeTimeVal = byId('wrtpilot_auto_upgrade_time').value || '';
        if (autoUpgradeEnabledVal === '1' && !autoUpgradeTimeVal) {
            window.alert(t('autoUpgradeTimeRequired'));
            return;
        }
        var timeoutSec = parseInt(byId('wrtpilot_timeout').value, 10) || 15;
        if (timeoutSec < 5) timeoutSec = 5;
        if (timeoutSec > 300) timeoutSec = 300;
        byId('wrtpilot_timeout').value = String(timeoutSec);

        byId('wrtpilot_basic_save').disabled = true;
        appendLog(t('savingBasic'));

        request('<%=url([[admin]], [[system]], [[wrtpilot]], [[config]])%>', {
            keep_config: keepConfig,
            fetch_timeout: String(timeoutSec),
            filter_ext_enabled: filterExtEnabledVal,
            auto_upgrade_enabled: autoUpgradeEnabledVal,
            auto_upgrade_time: autoUpgradeTimeVal
        }).then(function(resp) {
            byId('wrtpilot_basic_save').disabled = false;
            if (!resp.ok) {
                appendLog(resp.msg || t('requestFailed'));
                return;
            }

            if (resp.config) {
                byId('wrtpilot_keep').checked = (resp.config.keep_config || '1') === '1';
                byId('wrtpilot_timeout').value = resp.config.fetch_timeout || String(timeoutSec);
                updateConfig(resp.config);
            }

            appendLog(t('basicSaved'));
        }).catch(function(err) {
            byId('wrtpilot_basic_save').disabled = false;
            appendLog(t('requestFailed') + err);
        });
    }

    function stopDownloadPolling() {
        if (downloadPollTimer) {
            clearTimeout(downloadPollTimer);
            downloadPollTimer = null;
        }
    }

    function restoreButtonsAfterDownload() {
        setUpgradeWorkflowBusy(false);
    }

    function pollDownloadProgress(keepConfig, offset) {
        request('<%=url([[admin]], [[system]], [[wrtpilot]], [[download_status]])%>', {
            offset: String(offset || 0)
        }).then(function(resp) {
            if (!resp || !resp.ok) {
                appendLog(t('fetchFailed'));
                restoreButtonsAfterDownload();
                stopDownloadPolling();
                return;
            }

            var lines = normalizeLogLines(resp.logs);
            lines.forEach(appendLog);

            if (resp.done) {
                stopDownloadPolling();
                if (resp.download_ok && resp.fw_name) {
                    showUpgradeConfirmation(resp.fw_name, keepConfig);
                } else {
                    restoreButtonsAfterDownload();
                }
                return;
            }

            downloadPollTimer = setTimeout(function() {
                pollDownloadProgress(keepConfig, resp.next_offset || 0);
            }, 1000);
        }).catch(function(err) {
            appendLog(t('requestFailed') + err);
            restoreButtonsAfterDownload();
            stopDownloadPolling();
        });
    }
    function refreshStatus() {
        if (!ensureNotBusy()) {
            return;
        }
        var timeoutSec = parseInt(byId('wrtpilot_timeout').value, 10) || 15;
        if (timeoutSec < 5) timeoutSec = 5;
        if (timeoutSec > 300) timeoutSec = 300;

        byId('wrtpilot_refresh').disabled = true;
        byId('wrtpilot_notes').disabled = true;
        renderStatusCard({
            conclusion: t('beginFetch'),
            conclusionCls: 'wrtpilot-conclusion-warn',
            installValue: getCurrentInstallDisplay(),
            latestValue: t('fetchingInProgress'),
            publishedValue: t('fetchingInProgress'),
            releaseTotalValue: t('fetchingInProgress')
        });
        appendLog(t('beginFetch'));

        requestWithTimeout(
            '<%=url([[admin]], [[system]], [[wrtpilot]], [[status]])%>',
            { fetch_timeout: String(timeoutSec) },
            (timeoutSec + 5) * 1000
        ).then(function(resp) {
            appVersion = String(resp && resp.app_version || '');
            updateTitle();
                byId('wrtpilot_refresh').disabled = false;
                if (!resp.ok) {
                    byId('wrtpilot_notes').disabled = true;
                    latestReleaseUrl = '';
                    if (typeof resp.tz_offset_min === 'number') {
                        routerTzOffsetMin = resp.tz_offset_min;
                    }
                    if (resp.install_epoch) {
                        lastInstallEpoch = resp.install_epoch;
                    }
                    renderStatusCard({
                        conclusion: t('fetchGithubReleaseFailed'),
                        conclusionCls: 'wrtpilot-conclusion-warn',
                        installValue: resp.install_epoch ? formatEpochToRouter(resp.install_epoch) : getCurrentInstallDisplay(),
                        latestValue: t('fetchFieldFailed'),
                        publishedValue: t('fetchFieldFailed'),
                        releaseTotalValue: t('fetchFieldFailed'),
                        selectedRaw: (resp.config && resp.config.selected_release) || byId('wrtpilot_release').value
                    });
                    appendLog(resp.msg || t('fetchFailed'));
                    return;
                }
                if (resp.config) {
                    byId('wrtpilot_release').value = resp.config.selected_release || '';
                    byId('wrtpilot_keep').checked = (resp.config.keep_config || '1') === '1';
                    updateConfig(resp.config);
                }
                if (typeof resp.fetch_timeout === 'number') {
                    byId('wrtpilot_timeout').value = String(resp.fetch_timeout);
                }

                if (typeof resp.tz_offset_min === 'number') {
                    routerTzOffsetMin = resp.tz_offset_min;
                }
                if (resp.install_epoch) {
                    lastInstallEpoch = resp.install_epoch;
                }

                latestReleaseName = (resp.latest && resp.latest.release_name) ? resp.latest.release_name : '';
                latestReleaseUrl = (resp.latest && resp.latest.html_url) ? String(resp.latest.html_url) : '';
                assets = normalizeAssets(resp.latest && resp.latest.assets);
                selectedAsset = null;
                // Always reset filter on refresh to avoid stale keyword hiding all assets.
                byId('wrtpilot_search').value = '';
                renderAssets();
                applyAutoFirmwareFilter((resp.config && resp.config.selected_release) || '');
                byId('wrtpilot_notes').disabled = !latestReleaseUrl;
                // Allow repeated upgrade even when current system is already the latest,
                // as long as release assets are available for selection.
                byId('wrtpilot_upgrade').disabled = (assets.length === 0);

                var conclusionCls = resp.has_new ? 'wrtpilot-conclusion-new' : 'wrtpilot-conclusion-ok';
                var hintHtml = '';
                if (resp.fallback_used) {
                    hintHtml = '<div class="wrtpilot-status-line wrtpilot-conclusion-warn">' + escHtml(t('fallbackUsedHint')) + '</div>';
                } else if (resp.partial_assets) {
                    hintHtml = '<div class="wrtpilot-status-line wrtpilot-conclusion-warn">' + escHtml(t('partialAssetsHint')) + '</div>';
                }
                renderStatusCard({
                    conclusion: resp.msg || '-',
                    conclusionCls: conclusionCls,
                    installValue: resp.install_epoch ? formatEpochToRouter(resp.install_epoch) : t('unknown'),
                    latestValue: ((resp.latest && resp.latest.release_name) || '-'),
                    publishedValue: ((resp.latest && resp.latest.published_at) ? formatIsoToRouter(resp.latest.published_at) : '-'),
                    releaseTotalValue: (resp.latest && typeof resp.latest.release_total_count === 'number') ? String(resp.latest.release_total_count) : '-',
                    selectedRaw: (resp.config && resp.config.selected_release) || byId('wrtpilot_release').value,
                    hintHtml: hintHtml
                });

                appendLog(t('latestRelease') + ((resp.latest && resp.latest.release_name) || '-'));
                appendLog(resp.msg || t('statusUpdated'));
                if (resp.fallback_used) {
                    appendLog(t('fallbackUsedHint'));
                } else if (resp.partial_assets) {
                    appendLog(t('partialAssetsHint'));
                }

                syncInteractiveState();
            })
            .catch(function(err) {
                byId('wrtpilot_refresh').disabled = false;
                byId('wrtpilot_notes').disabled = true;
                latestReleaseUrl = '';
                renderStatusCard({
                    conclusion: t('fetchGithubReleaseFailed'),
                    conclusionCls: 'wrtpilot-conclusion-warn',
                    installValue: getCurrentInstallDisplay(),
                    latestValue: t('fetchFieldFailed'),
                    publishedValue: t('fetchFieldFailed'),
                    releaseTotalValue: t('fetchFieldFailed')
                });
                byId('wrtpilot_upgrade').disabled = true;
                if (err && err.name === 'AbortError') {
                    appendLog(t('fetchTimedOut'));
                } else {
                    appendLog(t('requestFailed') + err);
                }
            });
    }

    function openLatestReleasePage() {
        if (!latestReleaseUrl) {
            appendLog(t('notesUnavailable'));
            return;
        }
        var w = window.open(latestReleaseUrl, '_blank', 'noopener,noreferrer');
        if (!w) {
            appendLog(t('popupBlocked'));
        }
    }

    function doDownload() {
        if (!ensureNotBusy()) {
            return;
        }
        var selectedRelease = (byId('wrtpilot_release').value || '').trim();
        var keepConfig = byId('wrtpilot_keep').checked ? '1' : '0';

        if (!selectedRelease) {
            appendLog(t('chooseFirmware'));
            return;
        }

        if (!selectedAsset || !selectedAsset.url) {
            appendLog(t('chooseAsset'));
            return;
        }

        setUpgradeWorkflowBusy(true);
        stopDownloadPolling();

        appendLog(t('beginDownload') + (selectedAsset.name || selectedRelease));

        request('<%=url([[admin]], [[system]], [[wrtpilot]], [[download]])%>', {
            selected_release: selectedRelease,
            keep_config: keepConfig,
            asset_url: selectedAsset.url,
            asset_name: selectedAsset.name || selectedRelease,
            asset_size: String(selectedAsset.size || 0),
            asset_digest: selectedAsset.sha256 || ''
        }).then(function(resp) {
            var lines = normalizeLogLines(resp.logs);
            lines.forEach(appendLog);
            if (!resp.ok) {
                restoreButtonsAfterDownload();
                return;
            }

            if (resp.started) {
                pollDownloadProgress(keepConfig, 0);
                return;
            }

            if (resp.fw_name) {
                showUpgradeConfirmation(resp.fw_name, keepConfig);
            } else {
                restoreButtonsAfterDownload();
            }
        }).catch(function(err) {
            appendLog(t('upgradeReqFailed') + err);
            restoreButtonsAfterDownload();
        });
    }

    var pendingFirmwareName = '';
    var pendingKeepConfig = '1';

    function showUpgradeConfirmation(fwName, keepConfig) {
        pendingFirmwareName = String(fwName || '');
        pendingKeepConfig = keepConfig === '1' ? '1' : '0';
        if (!pendingFirmwareName) {
            appendLog(t('requestFailed'));
            restoreButtonsAfterDownload();
            return;
        }
        showUpgradeModal('confirm');
        appendLog(t('downloadReadyConfirm'));
    }

    function cancelUpgradeConfirmation() {
        pendingFirmwareName = '';
        pendingKeepConfig = '1';
        hideUpgradeModal();
        restoreButtonsAfterDownload();
        appendLog(t('upgradeCancelled'));
    }

    function confirmUpgrade() {
        if (!pendingFirmwareName) {
            appendLog(t('requestFailed'));
            hideUpgradeModal();
            restoreButtonsAfterDownload();
            return;
        }
        var fwName = pendingFirmwareName;
        var keepConfig = pendingKeepConfig;
        pendingFirmwareName = '';
        appendLog(t('startingUpgrade'));
        showUpgradeModal('upgrading');
        doUpgradeRequest(fwName, keepConfig);
    }

    function doUpgradeRequest(fwName, keepConfig) {
        request('<%=url([[admin]], [[system]], [[wrtpilot]], [[upgrade]])%>', {
            fw_name: fwName,
            keep_config: keepConfig
        }).then(function(resp) {
            var lines = normalizeLogLines(resp.logs);
            lines.forEach(appendLog);
            if (resp.ok && resp.rebooting) {
                showUpgradeModal('upgrading');
                pollForReboot();
                return;
            }

            hideUpgradeModal();
            restoreButtonsAfterDownload();
        }).catch(function(err) {
            appendLog(t('upgradeReqFailed') + err);
            hideUpgradeModal();
            restoreButtonsAfterDownload();
        });
    }

    function showUpgradeModal(stage, countdownSec) {
        var modal = byId('wrtpilot-upgrade-modal');
        var titleEl = byId('wrtpilot_modal_title');
        var msgEl = byId('wrtpilot_modal_msg');
        var currentStage = stage || 'upgrading';

        if (modal) {
            // Move modal to body root to avoid theme stacking-context clipping.
            if (modal.parentNode !== document.body) {
                document.body.appendChild(modal);
            }

            modal.style.display = 'flex';
        }

        var actionsEl = byId('wrtpilot_upgrade_actions');
        if (actionsEl) {
            actionsEl.style.display = currentStage === 'confirm' ? 'flex' : 'none';
        }

        if (titleEl && msgEl) {
            if (currentStage === 'confirm') {
                titleEl.textContent = t('confirmUpgradeTitle');
                msgEl.textContent = t('confirmUpgradeMsg');
            } else {
                titleEl.textContent = t('upgradingTitle');
                msgEl.textContent = t('upgradingMsg');
            }
        }

        upgradeModalActive = true;
        document.body.classList.add('wrtpilot-upgrade-lock');
        document.documentElement.classList.add('wrtpilot-upgrade-lock');
    }

    function hideUpgradeModal() {
        var modal = byId('wrtpilot-upgrade-modal');
        if (modal) {
            modal.style.display = 'none';
        }

        byId('wrtpilot_modal_title').textContent = t('upgradingTitle');
        byId('wrtpilot_modal_msg').textContent = t('upgradingMsg');
        var actionsEl = byId('wrtpilot_upgrade_actions');
        if (actionsEl) { actionsEl.style.display = 'none'; }

        upgradeModalActive = false;
        document.body.classList.remove('wrtpilot-upgrade-lock');
        document.documentElement.classList.remove('wrtpilot-upgrade-lock');
    }

    function pollForReboot() {
        if (rebootPollTimer) {
            clearTimeout(rebootPollTimer);
        }

        rebootPollAttempts = 0;
        rebootSeenOffline = false;

        var heartbeatUrl = '<%=url([[admin]], [[system]], [[wrtpilot]], [[local_status]])%>';

        var poll = function() {
            rebootPollTimer = setTimeout(function() {
                rebootPollAttempts++;

                fetch(heartbeatUrl + '?_=' + Date.now(), {
                    method: 'POST',
                    cache: 'no-cache',
                    credentials: 'include'
                })
                    .then(function() {
                        if (!rebootSeenOffline) {
                            poll();
                            return;
                        }

                        clearTimeout(rebootPollTimer);
                        hideUpgradeModal();
                        window.location.reload();
                    })
                    .catch(function() {
                        rebootSeenOffline = true;

                        // Keep waiting until router comes back online.
                        poll();
                    });
            }, 2500);
        };

        poll();
    }

    function blockNavigationWhileUpgrading(evt) {
        if (!upgradeModalActive) {
            return;
        }

        var modal = byId('wrtpilot-upgrade-modal');
        if (modal && modal.contains(evt.target)) {
            return;
        }

        evt.preventDefault();
        evt.stopPropagation();
    }

    document.addEventListener('click', blockNavigationWhileUpgrading, true);
    document.addEventListener('mousedown', blockNavigationWhileUpgrading, true);
    document.addEventListener('touchstart', blockNavigationWhileUpgrading, true);

    window.addEventListener('beforeunload', function(e) {
        if (!upgradeModalActive) {
            return;
        }
        e.preventDefault();
        e.returnValue = '';
    });

    byId('wrtpilot_refresh').addEventListener('click', refreshStatus);
    byId('wrtpilot_upgrade').addEventListener('click', doDownload);
    byId('wrtpilot_basic_save').addEventListener('click', saveBasicConfig);
    byId('wrtpilot_search').addEventListener('input', renderAssets);
    byId('wrtpilot_filter_ext_enabled').addEventListener('change', function() {
        if (upgradeWorkflowBusy) { return; }
        filterExtEnabled = this.checked;
        renderAssets();
    });
    byId('wrtpilot_auto_upgrade_enabled').addEventListener('change', function() {
        if (upgradeWorkflowBusy || !this.checked) { return; }
        if (!byId('wrtpilot_auto_upgrade_time').value) {
            this.checked = false;
            window.alert(t('autoUpgradeTimeRequired'));
            return;
        }
        if (!window.confirm(t('autoUpgradeConfirm'))) {
            this.checked = false;
        }
    });
    byId('wrtpilot_ext_config_btn').addEventListener('click', openExtConfigModal);
    byId('wrtpilot_ext_cancel').addEventListener('click', closeExtConfigModal);
    byId('wrtpilot_ext_save_btn').addEventListener('click', saveExtConfig);
    byId('wrtpilot_backup').addEventListener('click', function() {
        window.location.href = '<%=url([[admin]], [[system]], [[wrtpilot]], [[backup]])%>';
    });
    byId('wrtpilot_notes').addEventListener('click', openLatestReleasePage);
    byId('wrtpilot_upgrade_confirm').addEventListener('click', confirmUpgrade);
    byId('wrtpilot_upgrade_cancel').addEventListener('click', cancelUpgradeConfirmation);

    function openExtConfigModal() {
        if (upgradeWorkflowBusy) { return; }
        byId('wrtpilot_ext_textarea').value = validExtensions.join('\n');
        byId('wrtpilot-ext-modal').classList.add('wrtpilot-modal-open');
        byId('wrtpilot_ext_textarea').focus();
    }

    function closeExtConfigModal() {
        byId('wrtpilot-ext-modal').classList.remove('wrtpilot-modal-open');
    }

    function saveExtConfig() {
        var raw = byId('wrtpilot_ext_textarea').value || '';
        var lines = raw.split(/[\r\n]+/).map(function(s) { return s.trim(); }).filter(Boolean);
        if (lines.length === 0) {
            appendLog(t('extConfigSaving'));
            return;
        }
        var extStr = lines.join(' ');
        byId('wrtpilot_ext_save_btn').disabled = true;
        appendLog(t('extConfigSaving'));

        request('<%=url([[admin]], [[system]], [[wrtpilot]], [[config]])%>', {
            valid_extensions: extStr
        }).then(function(resp) {
            byId('wrtpilot_ext_save_btn').disabled = false;
            if (!resp.ok) {
                appendLog(resp.msg || t('requestFailed'));
                return;
            }
            if (resp.config) {
                updateConfig(resp.config);
            } else {
                validExtensions = lines;
            }
            renderAssets();
            appendLog(t('extConfigSaved'));
            closeExtConfigModal();
        }).catch(function(err) {
            byId('wrtpilot_ext_save_btn').disabled = false;
            appendLog(t('requestFailed') + err);
        });
    }

    function initLocalStatus() {
        request('<%=url([[admin]], [[system]], [[wrtpilot]], [[local_status]])%>', {})
            .then(function(resp) {
                if (!resp || !resp.ok) {
                    return;
                }

                appVersion = String(resp.app_version || '');
                updateTitle();

                if (resp.config) {
                    byId('wrtpilot_release').value = resp.config.selected_release || '';
                    byId('wrtpilot_keep').checked = (resp.config.keep_config || '1') === '1';
                    byId('wrtpilot_timeout').value = resp.config.fetch_timeout || byId('wrtpilot_timeout').value || '15';
                    updateConfig(resp.config);
                }

                if (typeof resp.tz_offset_min === 'number') {
                    routerTzOffsetMin = resp.tz_offset_min;
                }
                if (resp.install_epoch) {
                    lastInstallEpoch = resp.install_epoch;
                }

                renderStatusCard({
                    conclusion: t('beginFetch'),
                    conclusionCls: 'wrtpilot-conclusion-warn',
                    installValue: getCurrentInstallDisplay(),
                    latestValue: t('fetchingInProgress'),
                    publishedValue: t('fetchingInProgress'),
                    releaseTotalValue: t('fetchingInProgress'),
                    selectedRaw: (resp.config && resp.config.selected_release) || byId('wrtpilot_release').value
                });
            })
            .catch(function() {
                renderStatusCard({
                    conclusion: t('beginFetch'),
                    conclusionCls: 'wrtpilot-conclusion-warn',
                    installValue: getCurrentInstallDisplay(),
                    latestValue: t('fetchingInProgress'),
                    publishedValue: t('fetchingInProgress'),
                    releaseTotalValue: t('fetchingInProgress')
                });
            })
            .then(function() {
                refreshStatus();
            });
    }

    initTexts();
    applyTheme();
    setUpgradeWorkflowBusy(false);
    initLocalStatus();
})();
</script>

<%+footer%>
